<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page not found · Nicolás Gómez</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root { --bg:#07090c; --line:#212a38; --ink:#e8edf3; --dim:#a3b0bf; --faint:#7f8ca0; --accent:#22d3ee; --accent-ink:#07090c; --grid:rgba(34,211,238,.05); --trace:rgba(34,211,238,.3); }
      @media (prefers-color-scheme: light) {
        :root { --bg:#f5f7f9; --line:#d9e0e8; --ink:#0c1420; --dim:#465363; --faint:#5b6878; --accent:#0e7490; --accent-ink:#fff; --grid:rgba(14,116,144,.07); --trace:rgba(14,116,144,.28); }
      }
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100svh; display: grid; place-items: center; padding: 24px 16px;
        background: var(--bg); color: var(--ink); font-family: "IBM Plex Mono", ui-monospace, monospace;
        background-image: linear-gradient(to right, var(--grid) 1px, transparent 1px), linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
        background-size: 44px 44px;
      }
      main { max-width: 560px; width: 100%; }
      svg { width: 100%; max-width: 420px; height: auto; display: block; margin-bottom: 32px; }
      .k { color: var(--accent); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; }
      h1 { font-family: "Archivo", system-ui, sans-serif; font-stretch: 108%; font-weight: 600; font-size: clamp(2.2rem, 7vw, 3.4rem); letter-spacing: -.02em; line-height: 1.05; margin: 14px 0 16px; }
      p { color: var(--dim); font-family: system-ui, sans-serif; line-height: 1.6; }
      a.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; margin-top: 28px; padding: 0 24px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 600; text-decoration: none; font-family: system-ui, sans-serif; font-size: 14px; }
      a.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 420 80" fill="none" aria-hidden="true">
        <path d="M0 40H150" stroke="var(--trace)" stroke-width="2" stroke-linecap="round" />
        <circle cx="150" cy="40" r="6" stroke="var(--trace)" stroke-width="2" fill="var(--bg)" />
        <path d="M270 40H420" stroke="var(--trace)" stroke-width="2" stroke-linecap="round" />
        <circle cx="270" cy="40" r="6" stroke="var(--trace)" stroke-width="2" fill="var(--bg)" />
        <text x="210" y="46" text-anchor="middle" fill="var(--faint)" font-size="14" font-family="IBM Plex Mono, monospace">OPEN</text>
      </svg>
      <p class="k">Error 404 · open circuit</p>
      <h1>This trace doesn’t lead anywhere.</h1>
      <p>The page you’re looking for doesn’t exist or has moved.</p>
      <a class="btn" href="/">← Back to the portfolio</a>
    </main>
  </body>
</html>
